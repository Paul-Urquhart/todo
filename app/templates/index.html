<!doctype html>
<html>
<head>
    <title>Todo App</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <h1>My Todo List</h1>

    <form action="/add" method="POST">

    <input
        type="text"
        name="task">

    <button type="submit">Add</button>

</form>

<ul>
    {% for todo in todos %}
        <li>
            <form action="/delete/{{ todo.id }}" method="POST">
                {% if todo.done %}
                    <s>{{ todo.task }}</s>
                {% else %}
                    {{ todo.task }}
                {% endif %}
                <button type="submit">Delete</button>
            </form>
        </li>
    {% endfor %}
</ul>
</body>
</html>
